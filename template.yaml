
# File: backend/infrastructure/template.yaml
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SmartDigest AI - Weekly Information Noise Killer

Globals:
  Function:
    Timeout: 300
    Runtime: python3.12
    MemorySize: 256
    Environment:
      Variables:
        FEEDS_TABLE: !Ref FeedsTable
        ARTICLES_TABLE: !Ref ArticlesTable
        DIGESTS_TABLE: !Ref DigestsTable
        S3_BUCKET: !Ref FrontendBucket
        SUBSCRIBER_EMAIL: !Ref SubscriberEmail

Parameters:
  SubscriberEmail:
    Type: String
    Description: Email address to receive weekly digests
    Default: user@example.com

Resources:
  # ============ DynamoDB Tables ============
  FeedsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SmartDigest_Feeds
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: feed_id
          AttributeType: S
      KeySchema:
        - AttributeName: feed_id
          KeyType: HASH

  ArticlesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SmartDigest_Articles
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: article_id
          AttributeType: S
      KeySchema:
        - AttributeName: article_id
          KeyType: HASH

  DigestsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SmartDigest_Digests
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: digest_id
          AttributeType: S
      KeySchema:
        - AttributeName: digest_id
          KeyType: HASH

  # ============ S3 Frontend Bucket ============
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub smartdigest-frontend-${AWS::AccountId}
      WebsiteConfiguration:
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*

  # ============ Lambda Functions ============
  FeedCollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SmartDigest_Feed_Collector
      CodeUri: ../lambda_functions/feed_collector/
      Handler: lambda_function.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FeedsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ArticlesTable
        - LambdaInvokePolicy:
            FunctionName: !Ref AISummarizerFunction
      Events:
        WeeklySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 6 ? * MON *)
            Description: Trigger feed collection every Monday at 6 AM UTC
            Enabled: true

  AISummarizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SmartDigest_AI_Summarizer
      CodeUri: ../lambda_functions/ai_summarizer/
      Handler: lambda_function.lambda_handler
      Timeout: 900
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ArticlesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DigestsTable
        - LambdaInvokePolicy:
            FunctionName: !Ref DigestDeliveryFunction
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: '*'

  DigestDeliveryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SmartDigest_Delivery
      CodeUri: ../lambda_functions/digest_delivery/
      Handler: lambda_function.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DigestsTable
        - S3CrudPolicy:
            BucketName: !Ref FrontendBucket
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'

  # ============ API Gateway for Frontend ============
  DigestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowOrigin: "'*'"
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"

  ApiHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SmartDigest_API_Handler
      CodeUri: ../lambda_functions/feed_collector/
      Handler: api_handler.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FeedsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ArticlesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DigestsTable
      Events:
        GetDigest:
          Type: Api
          Properties:
            RestApiId: !Ref DigestApi
            Path: /digest/latest
            Method: get
        GetFeeds:
          Type: Api
          Properties:
            RestApiId: !Ref DigestApi
            Path: /feeds
            Method: get
        AddFeed:
          Type: Api
          Properties:
            RestApiId: !Ref DigestApi
            Path: /feeds
            Method: post

Outputs:
  FrontendURL:
    Description: URL for the SmartDigest frontend
    Value: !GetAtt FrontendBucket.WebsiteURL
  ApiURL:
    Description: API Gateway endpoint
    Value: !Sub https://${DigestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/